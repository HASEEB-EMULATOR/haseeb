name: Build Ananbox APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with the anbox submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # cmdline-tools (13114758) needs JDK 17 to run
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Host tools (clang for the build scripts, ccache for speed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld ccache ninja-build
          which clang clang++ || true
          # CMakeLists hardcodes /usr/bin/clang - make sure it exists
          if [ ! -e /usr/bin/clang ]; then sudo ln -sf "$(which clang)" /usr/bin/clang; fi
          if [ ! -e /usr/bin/clang++ ]; then sudo ln -sf "$(which clang++)" /usr/bin/clang++; fi
          ls -l /usr/bin/clang /usr/bin/clang++

      - name: Install Android SDK + NDK + CMake
        run: |
          set -e
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK"
          curl -sSLo clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q clt.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" \
            "platforms;android-33" "build-tools;33.0.2" "cmake;3.22.1" "ndk;23.1.7779620"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > local.properties

      # AGP 7.3.1 + Gradle 7.4 want JDK 11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Check the submodule arrived
        run: |
          if [ ! -f app/src/main/cpp/anbox/CMakeLists.txt ]; then
            echo "::error::submodule app/src/main/cpp/anbox is empty - check .gitmodules"
            ls -la app/src/main/cpp || true
            exit 1
          fi
          echo "submodule ok"

      - name: Pre-fetch Boost (works around the broken RENAME in cmake/Boost.cmake)
        run: |
          set -e
          cd app/src/main/cpp
          if [ ! -d boost ]; then
            echo "downloading boost 1.83.0"
            curl -sSLo boost.tar.xz https://github.com/boostorg/boost/releases/download/boost-1.83.0/boost-1.83.0.tar.xz
            tar -xf boost.tar.xz
            mv boost-1.83.0 boost
            rm -f boost.tar.xz
          fi
          test -f boost/CMakeLists.txt || { echo "::error::boost tree is not where CMake expects it"; exit 1; }
          du -sh boost

      - name: Pre-fetch talloc (samba.org is unreliable from CI)
        run: |
          cd app/src/main/cpp
          for u in \
            "https://download.samba.org/pub/talloc/talloc-2.4.1.tar.gz" \
            "https://ftp.samba.org/pub/talloc/talloc-2.4.1.tar.gz" \
            "https://www.samba.org/ftp/talloc/talloc-2.4.1.tar.gz"
          do
            echo "trying $u"
            if curl -fL --retry 4 --retry-delay 3 --connect-timeout 20 -o talloc-2.4.1.tar.gz "$u"; then
              echo "got talloc"; break
            fi
          done
          test -s talloc-2.4.1.tar.gz || { echo "::error::could not download talloc"; exit 1; }
          ls -lh talloc-2.4.1.tar.gz
          python3 - <<'EOF'
          p = 'cmake/Talloc.cmake'
          s = open(p).read()
          if 'talloc-2.4.1.tar.gz' in s and 'CMAKE_SOURCE_DIR' in s:
              print('Talloc.cmake already patched')
          else:
              s = s.replace('URL https://download.samba.org/pub/talloc/talloc-2.4.1.tar.gz',
                            'URL ${CMAKE_SOURCE_DIR}/talloc-2.4.1.tar.gz')
              open(p, 'w').write(s)
              print('Talloc.cmake patched')
          EOF
          grep -n "URL " cmake/Talloc.cmake

      - name: Patch proot so Android's seccomp filter cannot kill the guest
        run: |
          echo '' | base64 -d > app/src/main/cpp/patch-proot.sh
          chmod +x app/src/main/cpp/patch-proot.sh
          python3 - <<'EOF'
          p = 'app/src/main/cpp/cmake/Proot.cmake'
          s = open(p).read()
          if 'patch-proot.sh' in s:
              print('Proot.cmake already patched')
          else:
              s = s.replace("        GIT_SHALLOW 1\n",
                            "        GIT_SHALLOW 1\n        PATCH_COMMAND sh ${CMAKE_CURRENT_SOURCE_DIR}/patch-proot.sh\n")
              open(p, 'w').write(s)
              print('Proot.cmake patched')
          EOF
          grep -n "PATCH_COMMAND" app/src/main/cpp/cmake/Proot.cmake

      - name: Only build arm64 (halves the time)
        run: |
          sed -i "s/abiFilters .*/abiFilters 'arm64-v8a'/" app/build.gradle
          grep -n "abiFilters" app/build.gradle

      - name: Disable proot's python extension (host Python breaks the cross build)
        run: |
          python3 - <<'EOF'
          p = 'app/src/main/cpp/cmake/Proot.cmake'
          s = open(p).read()
          if 'HAS_PYTHON_CONFIG=' in s:
              print('already patched')
          else:
              s = s.replace('LDFLAGS=${PROOT_LINKER_FLAGS}',
                            'LDFLAGS=${PROOT_LINKER_FLAGS} HAS_PYTHON_CONFIG= HAS_SWIG=')
              open(p, 'w').write(s)
              print('patched Proot.cmake')
          EOF
          grep -n "HAS_PYTHON_CONFIG" app/src/main/cpp/cmake/Proot.cmake

      - name: Build
        run: |
          chmod +x gradlew
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=2G
          export PATH="/usr/lib/ccache:$PATH"
          set +e
          ./gradlew --no-daemon assembleDebug > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "--- real errors ---"
            grep -nE "(^|: )error:|fatal error:|FAILED:|CMake Error|undefined reference|ninja: build stopped" build.log \
              | grep -v "note:" | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            n=$(grep -nE "(^|: )error:|fatal error:|FAILED:|undefined reference" build.log | grep -v "note:" | head -1 | cut -d: -f1)
            if [ -n "$n" ]; then
              echo "--- context around first error (line $n) ---"
              sed -n "$(( n > 10 ? n - 10 : 1 )),$(( n + 25 ))p" build.log
            fi
            echo "--- last 40 lines ---"
            tail -40 build.log
            exit $rc
          fi
          ls -lh app/build/outputs/apk/debug/

      - name: Save the build error into the repo (so it can be read without logs)
        if: failure()
        run: |
          {
            echo "run: ${{ github.run_id }}"
            echo
            echo "=== real errors ==="
            grep -nE "(^|: )error:|fatal error:|FAILED:|CMake Error|undefined reference|ninja: build stopped" build.log 2>/dev/null \
              | grep -v "note:" | head -40
            echo
            n=$(grep -nE "(^|: )error:|fatal error:|FAILED:|undefined reference" build.log 2>/dev/null | grep -v "note:" | head -1 | cut -d: -f1)
            if [ -n "$n" ]; then
              echo "=== context around line $n ==="
              sed -n "$(( n > 20 ? n - 20 : 1 )),$(( n + 35 ))p" build.log
            fi
            echo
            echo "=== last 50 lines ==="
            tail -50 build.log 2>/dev/null
          } > build-error.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -f build-error.txt
          git commit -m "build error log" || true
          git pull --rebase --autostash || true
          git push || true

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ananbox build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: ananbox-apk
          path: app/build/outputs/apk/debug/*.apk
